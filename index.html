<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quero te Conhecer</title>
    <!-- Carregando PapaParse para ler o CSV e Chart.js para os gráficos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #ffffff;
            --border-color: #30363d;
            --blue-neon: #00E5FF;
            --pink-neon: #FF00FF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        * { box-sizing: border-box; }

        /* Textos Limpos e Brancos */
        h1, h2, h3, p, label, span {
            color: var(--text-color);
            margin: 0;
            text-shadow: none;
            font-weight: 500;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        h2 {
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Botões do Topo */
        .header-actions {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-copy {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Painel de Filtros (Segmentação) */
        .filters-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #8b949e;
        }

        select, input[type="date"] {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            color-scheme: dark;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--blue-neon);
        }

        /* KPIs */
        .kpi-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .kpi-card {
            flex: 1;
            min-width: 250px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .kpi-card h3 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #8b949e;
        }

        .kpi-value {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Detalhamento dentro do KPI */
        .kpi-details {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            text-align: left;
            margin-top: auto;
        }

        .kpi-detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .kpi-detail-item span:first-child {
            color: #c9d1d9;
        }
        
        .kpi-detail-item span:last-child {
            font-weight: bold;
            font-size: 15px;
        }

        /* Gráficos */
        .charts-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .chart-card {
            flex: 1;
            min-width: 300px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* Container do Canvas - Agora com altura super restrita no modo normal */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 300px; /* Altura exata para forçar a volta ao tamanho original */
            margin-top: 10px;
        }

        /* Botão Ampliar Gráfico */
        .btn-expand {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
            transition: 0.2s;
        }

        .btn-expand:hover {
            border-color: var(--blue-neon);
        }

        /* Modo Tela Cheia */
        .chart-card.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background-color: var(--bg-color);
            border-radius: 0;
            border: none;
            padding: 40px;
            margin: 0;
        }

        /* Na tela cheia, o contêiner do canvas ganha espaço dinâmico */
        .chart-card.fullscreen .canvas-container {
            height: calc(100vh - 120px);
        }

        .chart-card.fullscreen .btn-expand {
            top: 20px;
            right: 30px;
            font-size: 14px;
            padding: 8px 16px;
            background-color: rgba(255, 0, 0, 0.1);
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .chart-card.fullscreen .btn-expand:hover {
            background-color: #ff4444;
            color: #fff;
        }
        
        .loading { text-align: center; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Dashboard - Quero te Conhecer</h1>
    
    <div id="loading" class="loading">Baixando e processando dados...</div>

    <div id="dashboard-content" style="display: none;">
        
        <!-- PAINEL DE FILTROS -->
        <div class="filters-container">
            <div class="filter-group">
                <label for="filter-cidade">Cidade:</label>
                <select id="filter-cidade">
                    <option value="all">Todas as Cidades</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-bairro">Bairro:</label>
                <select id="filter-bairro">
                    <option value="all">Todos os Bairros</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-inicio">Data Início:</label>
                <input type="date" id="filter-inicio">
            </div>
            <div class="filter-group">
                <label for="filter-fim">Data Fim:</label>
                <input type="date" id="filter-fim">
            </div>
        </div>

        <!-- AÇÕES -->
        <div class="header-actions">
            <button id="btn-copy" class="btn-copy" onclick="copiarDados()">📋 Copiar Dados</button>
        </div>

        <!-- KPIs -->
        <div class="kpi-row">
            <!-- Card Usuários -->
            <div class="kpi-card">
                <h3>Total de Novos Usuários</h3>
                <p class="kpi-value" id="kpi-users">0</p>
                
                <div class="kpi-details">
                    <div class="kpi-detail-item">
                        <span>Obreiros:</span>
                        <span id="kpi-obreiros">0</span>
                    </div>
                    <div class="kpi-detail-item">
                        <span>Membros (Homens):</span>
                        <span id="kpi-membro-homem">0</span>
                    </div>
                    <div class="kpi-detail-item">
                        <span>Obreiras:</span>
                        <span id="kpi-obreiras">0</span>
                    </div>
                    <div class="kpi-detail-item">
                        <span>Membros (Mulheres):</span>
                        <span id="kpi-membro-mulher">0</span>
                    </div>
                </div>
            </div>

            <!-- Card Avaliações -->
            <div class="kpi-card">
                <h3>Total de Avaliações</h3>
                <p class="kpi-value" id="kpi-evals">0</p>
                
                <div class="kpi-details">
                    <div class="kpi-detail-item">
                        <span>Avaliações Android:</span>
                        <span id="kpi-aval-android">0</span>
                    </div>
                    <div class="kpi-detail-item">
                        <span>Avaliações IOS:</span>
                        <span id="kpi-aval-ios">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- GRÁFICOS DE BARRAS -->
        <h2>Desempenho por Bairro</h2>
        <div class="charts-row">
            <div class="chart-card">
                <button class="btn-expand" onclick="toggleExpand(this)">⛶ Ampliar</button>
                <div class="canvas-container">
                    <canvas id="chartBairroUsers"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <button class="btn-expand" onclick="toggleExpand(this)">⛶ Ampliar</button>
                <div class="canvas-container">
                    <canvas id="chartBairroEvals"></canvas>
                </div>
            </div>
        </div>

        <!-- GRÁFICOS DE LINHAS -->
        <h2>Evolução ao Longo do Tempo</h2>
        <div class="charts-row">
            <div class="chart-card">
                <button class="btn-expand" onclick="toggleExpand(this)">⛶ Ampliar</button>
                <div class="canvas-container">
                    <canvas id="chartTempoUsers"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <button class="btn-expand" onclick="toggleExpand(this)">⛶ Ampliar</button>
                <div class="canvas-container">
                    <canvas id="chartTempoEvals"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Link CSV publicado do Google Sheets
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSS9faCvsxi4P_mQ-2CNqUJ8H9m9onYcMwOlBonyqT_wFe-BACv_aLuD1ZD8fBgCTdRN8qsm4oGANHt/pub?gid=949734563&single=true&output=csv";

    // Configuração global de fontes e cores do Chart.js
    Chart.defaults.color = '#ffffff'; 
    Chart.defaults.borderColor = '#30363d'; 
    Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

    const neonBlue = '#00E5FF';
    const neonPink = '#FF00FF';

    let rawData = [];
    let chartBairroUsersInst, chartBairroEvalsInst, chartTempoUsersInst, chartTempoEvalsInst;

    let currentMetrics = {
        avalAndroid: 0, avalIos: 0, obreiros: 0, obreiras: 0, 
        membroHomem: 0, membroMulher: 0, totalAval: 0, totalUser: 0
    };

    const filterCidade = document.getElementById('filter-cidade');
    const filterBairro = document.getElementById('filter-bairro');
    const filterInicio = document.getElementById('filter-inicio');
    const filterFim = document.getElementById('filter-fim');

    // Função de Tela Cheia Aprimorada (Força o redimensionamento do Chart.js)
    function toggleExpand(btn) {
        const card = btn.closest('.chart-card');
        card.classList.toggle('fullscreen');
        
        if (card.classList.contains('fullscreen')) {
            btn.innerHTML = '✖ Fechar';
            document.body.style.overflow = 'hidden'; 
        } else {
            btn.innerHTML = '⛶ Ampliar';
            document.body.style.overflow = 'auto'; 
        }

        // Aguarda a transição do CSS terminar (300ms) para recalcular o tamanho
        setTimeout(() => {
            if (chartBairroUsersInst) chartBairroUsersInst.resize();
            if (chartBairroEvalsInst) chartBairroEvalsInst.resize();
            if (chartTempoUsersInst) chartTempoUsersInst.resize();
            if (chartTempoEvalsInst) chartTempoEvalsInst.resize();
        }, 350);
    }

    function initDashboard() {
        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                rawData = results.data.filter(row => row['Métrica']); 
                initializeFilters();
                applyFilters(); 
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
            },
            error: function(err) {
                document.getElementById('loading').innerText = "Erro ao carregar dados da planilha.";
            }
        });
    }

    function initializeFilters() {
        let cidades = new Set();
        let datas = [];

        rawData.forEach(row => {
            if (row['Cidade']) cidades.add(row['Cidade']);
            
            const dataHora = row['Data e Hora de Envio'];
            if(dataHora) {
                const [dia, mes, anoTime] = dataHora.split('/');
                const ano = anoTime.split(' ')[0];
                datas.push(`${ano}-${mes}-${dia}`);
            }
        });

        Array.from(cidades).sort().forEach(cidade => {
            let option = document.createElement('option');
            option.value = cidade;
            option.text = cidade;
            filterCidade.appendChild(option);
        });

        if(datas.length > 0) {
            datas.sort();
            filterInicio.value = datas[0];
            filterFim.value = datas[datas.length - 1];
        }

        filterCidade.addEventListener('change', () => {
            updateBairrosDropdown();
            applyFilters();
        });
        filterBairro.addEventListener('change', applyFilters);
        filterInicio.addEventListener('change', applyFilters);
        filterFim.addEventListener('change', applyFilters);
    }

    function updateBairrosDropdown() {
        const cidadeSelecionada = filterCidade.value;
        filterBairro.innerHTML = '<option value="all">Todos os Bairros</option>';
        
        if (cidadeSelecionada === 'all') return;

        let bairros = new Set();
        rawData.forEach(row => {
            if (row['Cidade'] === cidadeSelecionada && row['Bairro']) {
                bairros.add(row['Bairro']);
            }
        });

        Array.from(bairros).sort().forEach(bairro => {
            let option = document.createElement('option');
            option.value = bairro;
            option.text = bairro;
            filterBairro.appendChild(option);
        });
    }

    function applyFilters() {
        const selCidade = filterCidade.value;
        const selBairro = filterBairro.value;
        const dataInicio = filterInicio.value;
        const dataFim = filterFim.value;

        const filteredData = rawData.filter(row => {
            if (selCidade !== 'all' && row['Cidade'] !== selCidade) return false;
            if (selBairro !== 'all' && row['Bairro'] !== selBairro) return false;

            const dataHora = row['Data e Hora de Envio'];
            if (dataHora) {
                const [dia, mes, anoTime] = dataHora.split('/');
                const ano = anoTime.split(' ')[0];
                const dataFormatada = `${ano}-${mes}-${dia}`;
                
                if (dataInicio && dataFormatada < dataInicio) return false;
                if (dataFim && dataFormatada > dataFim) return false;
            }
            return true;
        });
        processData(filteredData);
    }

    function sortObjectByDate(obj) {
        return Object.keys(obj).sort((a, b) => {
            const [dayA, monthA, yearA] = a.split('/');
            const [dayB, monthB, yearB] = b.split('/');
            return new Date(`${yearA}-${monthA}-${dayA}`) - new Date(`${yearB}-${monthB}-${dayB}`);
        }).reduce((acc, key) => { acc[key] = obj[key]; return acc; }, {});
    }

    function processData(data) {
        currentMetrics = { avalAndroid: 0, avalIos: 0, obreiros: 0, obreiras: 0, membroHomem: 0, membroMulher: 0, totalAval: 0, totalUser: 0 };
        
        let totalUsers = 0, totalEvals = 0;
        let bairroUsers = {}, bairroEvals = {}, tempoUsers = {}, tempoEvals = {};

        data.forEach(row => {
            const metric = row['Métrica'];
            const qty = parseInt(row['Quantidade']) || 0;
            const bairro = row['Bairro'];
            const dataApenas = row['Data e Hora de Envio'].split(' ')[0];

            if (metric === 'Avaliações Android') currentMetrics.avalAndroid += qty;
            else if (metric === 'Avaliações iOS' || metric === 'Avaliações IOS') currentMetrics.avalIos += qty;
            else if (metric === 'Obreiros') currentMetrics.obreiros += qty;
            else if (metric === 'Obreiras') currentMetrics.obreiras += qty;
            else if (metric === 'Membros (Homens)') currentMetrics.membroHomem += qty;
            else if (metric === 'Membros (Mulheres)') currentMetrics.membroMulher += qty;

            if (metric.includes('Avaliaç')) {
                totalEvals += qty;
                bairroEvals[bairro] = (bairroEvals[bairro] || 0) + qty;
                tempoEvals[dataApenas] = (tempoEvals[dataApenas] || 0) + qty;
            } else {
                totalUsers += qty;
                bairroUsers[bairro] = (bairroUsers[bairro] || 0) + qty;
                tempoUsers[dataApenas] = (tempoUsers[dataApenas] || 0) + qty;
            }
        });

        currentMetrics.totalAval = totalEvals;
        currentMetrics.totalUser = totalUsers;

        tempoUsers = sortObjectByDate(tempoUsers);
        tempoEvals = sortObjectByDate(tempoEvals);
        
        // Filtro adicional: apenas itens com valor maior que 0 e ordenados
        const sortBairros = (obj) => Object.fromEntries(
            Object.entries(obj)
                .filter(([,val]) => val > 0) // <--- Filtro aplicado aqui
                .sort(([,a],[,b]) => b - a)
        );

        bairroUsers = sortBairros(bairroUsers);
        bairroEvals = sortBairros(bairroEvals);

        document.getElementById('kpi-users').innerText = totalUsers;
        document.getElementById('kpi-evals').innerText = totalEvals;
        document.getElementById('kpi-obreiros').innerText = currentMetrics.obreiros;
        document.getElementById('kpi-obreiras').innerText = currentMetrics.obreiras;
        document.getElementById('kpi-membro-homem').innerText = currentMetrics.membroHomem;
        document.getElementById('kpi-membro-mulher').innerText = currentMetrics.membroMulher;
        document.getElementById('kpi-aval-android').innerText = currentMetrics.avalAndroid;
        document.getElementById('kpi-aval-ios').innerText = currentMetrics.avalIos;

        renderCharts(bairroUsers, bairroEvals, tempoUsers, tempoEvals);
    }

    function copiarDados() {
        let periodoText = "Todo o período";
        const dInicio = filterInicio.value;
        const dFim = filterFim.value;

        const formatBR = (dataISO) => dataISO.split('-').reverse().join('/');

        if (dInicio && dFim) {
            periodoText = `${formatBR(dInicio)} a ${formatBR(dFim)}`;
        } else if (dInicio) {
            periodoText = `A partir de ${formatBR(dInicio)}`;
        } else if (dFim) {
            periodoText = `Até ${formatBR(dFim)}`;
        }

        const texto = `Período: ${periodoText}

------AVALIAÇÕES------

Avaliações Android: ${currentMetrics.avalAndroid}
Avaliações IOS: ${currentMetrics.avalIos}
Total Avaliações: ${currentMetrics.totalAval}

------NOVOS USUÁRIOS------

Obreiros: ${currentMetrics.obreiros}
Obreiras: ${currentMetrics.obreiras}
Membros (Homens): ${currentMetrics.membroHomem}
Membros (Mulheres): ${currentMetrics.membroMulher}
Total Novos Usuários: ${currentMetrics.totalUser}`;

        navigator.clipboard.writeText(texto).then(() => {
            const btn = document.getElementById('btn-copy');
            const originalText = btn.innerText;
            btn.innerText = "✅ Copiado com sucesso!";
            setTimeout(() => { btn.innerText = originalText; }, 2000);
        }).catch(err => {
            alert("Erro ao copiar os dados: " + err);
        });
    }

    function renderCharts(bUsers, bEvals, tUsers, tEvals) {
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false, 
            plugins: { legend: { display: false } }
        };
        
        const ctxBairroUsers = document.getElementById('chartBairroUsers').getContext('2d');
        if(chartBairroUsersInst) chartBairroUsersInst.destroy();
        chartBairroUsersInst = new Chart(ctxBairroUsers, {
            type: 'bar',
            data: {
                labels: Object.keys(bUsers),
                datasets: [{ data: Object.values(bUsers), backgroundColor: neonBlue, borderRadius: 4 }]
            },
            options: { ...chartOptions, plugins: { title: { display: true, text: 'Novos Usuários por Bairro' }, legend: { display: false } } }
        });

        const ctxBairroEvals = document.getElementById('chartBairroEvals').getContext('2d');
        if(chartBairroEvalsInst) chartBairroEvalsInst.destroy();
        chartBairroEvalsInst = new Chart(ctxBairroEvals, {
            type: 'bar',
            data: {
                labels: Object.keys(bEvals),
                datasets: [{ data: Object.values(bEvals), backgroundColor: neonPink, borderRadius: 4 }]
            },
            options: { ...chartOptions, plugins: { title: { display: true, text: 'Avaliações por Bairro' }, legend: { display: false } } }
        });

        const ctxTempoUsers = document.getElementById('chartTempoUsers').getContext('2d');
        if(chartTempoUsersInst) chartTempoUsersInst.destroy();
        chartTempoUsersInst = new Chart(ctxTempoUsers, {
            type: 'line',
            data: {
                labels: Object.keys(tUsers),
                datasets: [{ data: Object.values(tUsers), borderColor: neonBlue, backgroundColor: neonBlue, borderWidth: 2, tension: 0.3, fill: false }]
            },
            options: { ...chartOptions, scales: { y: { beginAtZero: true } }, plugins: { title: { display: true, text: 'Evolução de Novos Usuários' }, legend: { display: false } } }
        });

        const ctxTempoEvals = document.getElementById('chartTempoEvals').getContext('2d');
        if(chartTempoEvalsInst) chartTempoEvalsInst.destroy();
        chartTempoEvalsInst = new Chart(ctxTempoEvals, {
            type: 'line',
            data: {
                labels: Object.keys(tEvals),
                datasets: [{ data: Object.values(tEvals), borderColor: neonPink, backgroundColor: neonPink, borderWidth: 2, tension: 0.3, fill: false }]
            },
            options: { ...chartOptions, scales: { y: { beginAtZero: true } }, plugins: { title: { display: true, text: 'Evolução das Avaliações' }, legend: { display: false } } }
        });
    }

    window.onload = initDashboard;
</script>

</body>
</html>
